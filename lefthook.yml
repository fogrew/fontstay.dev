pre-commit:
  parallel: false
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,json,jsonc,css,astro,html}"
      run: pnpm exec biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: architecture
      glob: "*.{ts,mts,cts,tsx,astro}"
      run: pnpm exec feod-analyzer analyze . --fail-on warning
    - name: typecheck
      glob: "*.{ts,mts,cts,tsx,astro,json}"
      run: pnpm check

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: protected-branches
      use_stdin: true
      run: node scripts/guard-push.mjs
